      - Deploy a production cluster: guides/deploy-cluster.md
      - Onboard a service (VM or Docker): guides/onboard-service.md
      - Kubernetes: guides/kubernetes.md
      - Other languages: guides/other-languages.md
      - Rotate secrets: guides/rotation.md
      - Dynamic database credentials: guides/dynamic-credentials.md
      - Audit forwarding and alerts: guides/audit-forwarding.md
      - Monitoring: guides/monitoring.md
      - Backups and restore: guides/backups.md
      - Shares, rekey and root admin: guides/key-ceremonies.md
      - Revoke access: guides/revocation.md
      - Build and verify releases: guides/releases.md
  - Reference:
      - reference/index.md
      - HTTP API: reference/http-api.md
      - Configuration: reference/configuration.md
      - Policy language: reference/policy-language.md
      - Metrics: reference/metrics.md
      - Audit record format: reference/audit-format.md
      - Defaults and limits: reference/defaults.md
  - Operations:
      - Production checklist: production-checklist.md
      - Runbooks:
          - runbooks/README.md
          - Unseal after a restart: runbooks/unseal-after-restart.md
          - Lost node: runbooks/lost-node.md
          - Lost quorum: runbooks/lost-quorum.md
          - Restore from backup: runbooks/restore-from-backup.md
          - Compromised service certificate: runbooks/compromised-service-cert.md
          - Compromised share holder: runbooks/compromised-share-holder.md
          - Rolling upgrade: runbooks/rolling-upgrade.md
